plugins {
    id 'java'
}

group = 'com.informallounge'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'hytale'
        url = 'https://maven.hytale.com/release'
    }
}

dependencies {
    // Compiles against hytaleVersion from gradle.properties.
    // To use a local server jar instead: -PhytaleServerJar=/path/to/HytaleServer.jar
    def localServerJar = findProperty('hytaleServerJar')
    if (localServerJar) {
        compileOnly files(localServerJar)
    } else {
        compileOnly "com.hypixel.hytale:Server:${hytaleVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('manifest.json') {
        expand version: project.version
    }
}
