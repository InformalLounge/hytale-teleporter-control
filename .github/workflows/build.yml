name: Build

# Every push and pull request is compiled, and the jar is attached to the run.
# Pushing a tag like v1.2.0 also publishes a GitHub release with TeleporterControl-1.2.0.jar.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./gradlew build -Pversion="${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TeleporterControl-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made in the GitHub UI already exists by the time this runs; just attach the jar.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
              --title "TeleporterControl ${{ steps.version.outputs.version }}" \
              --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi
